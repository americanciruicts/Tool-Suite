<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.86"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Backplate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner highlight to give the plate depth -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Stacked sheets (back sheet) — represents "two BOMs being compared" -->
  <g filter="url(#softShadow)" transform="translate(112 132)">
    <rect x="36" y="0" width="252" height="296" rx="22" fill="url(#sheet)" opacity="0.55"/>
  </g>

  <!-- Front sheet with grid -->
  <g filter="url(#softShadow)" transform="translate(96 116)">
    <rect width="280" height="312" rx="26" fill="url(#sheet)"/>
    <!-- Header band -->
    <rect x="22" y="24" width="236" height="20" rx="6" fill="#a5b4fc"/>
    <rect x="22" y="24" width="120" height="20" rx="6" fill="#6366f1"/>
    <!-- Column dividers -->
    <line x1="22" y1="68" x2="258" y2="68" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="120" y1="68" x2="120" y2="280" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="200" y1="68" x2="200" y2="280" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Row 1 -->
    <rect x="32" y="80" width="62" height="10" rx="4" fill="#475569"/>
    <rect x="130" y="80" width="48" height="10" rx="4" fill="#94a3b8"/>
    <rect x="210" y="80" width="40" height="10" rx="4" fill="#94a3b8"/>
    <!-- Row 2 (highlighted = "modified" — emerald) -->
    <rect x="22" y="104" width="236" height="34" rx="8" fill="#dcfce7"/>
    <rect x="32" y="116" width="62" height="10" rx="4" fill="#16a34a"/>
    <rect x="130" y="116" width="48" height="10" rx="4" fill="#16a34a"/>
    <rect x="210" y="116" width="40" height="10" rx="4" fill="#16a34a"/>
    <!-- Row 3 -->
    <rect x="32" y="152" width="62" height="10" rx="4" fill="#475569"/>
    <rect x="130" y="152" width="48" height="10" rx="4" fill="#94a3b8"/>
    <rect x="210" y="152" width="40" height="10" rx="4" fill="#94a3b8"/>
    <!-- Row 4 (removed = rose strikethrough) -->
    <rect x="32" y="176" width="62" height="10" rx="4" fill="#fca5a5"/>
    <rect x="130" y="176" width="48" height="10" rx="4" fill="#fca5a5"/>
    <rect x="210" y="176" width="40" height="10" rx="4" fill="#fca5a5"/>
    <line x1="28" y1="181" x2="254" y2="181" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Row 5 -->
    <rect x="32" y="200" width="62" height="10" rx="4" fill="#475569"/>
    <rect x="130" y="200" width="48" height="10" rx="4" fill="#94a3b8"/>
    <rect x="210" y="200" width="40" height="10" rx="4" fill="#94a3b8"/>
    <!-- Row 6 -->
    <rect x="32" y="224" width="62" height="10" rx="4" fill="#475569"/>
    <rect x="130" y="224" width="48" height="10" rx="4" fill="#94a3b8"/>
    <rect x="210" y="224" width="40" height="10" rx="4" fill="#94a3b8"/>
  </g>

  <!-- AI sparkle in upper-right — signals smart/AI extraction -->
  <g transform="translate(380 88)">
    <circle r="36" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="#ffffff"/>
    <circle cx="20" cy="-18" r="3" fill="#ffffff"/>
    <circle cx="-20" cy="20" r="2" fill="#ffffff"/>
  </g>

  <!-- Diff arrow at bottom — signals "compare" -->
  <g transform="translate(256 432)">
    <rect x="-72" y="-18" width="144" height="36" rx="18" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M-44 0 L-20 -10 L-20 -3 L20 -3 L20 -10 L44 0 L20 10 L20 3 L-20 3 L-20 10 Z" fill="#4f46e5"/>
  </g>
</svg>
