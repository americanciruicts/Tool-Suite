<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Tool Suite">
  <defs>
    <!-- Backplate gradient: indigo → violet → fuchsia, diagonal -->
    <linearGradient id="ts-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1"    stop-color="#d946ef"/>
    </linearGradient>

    <!-- Aurora wash behind the cards -->
    <radialGradient id="ts-aurora" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassy front-card gradient -->
    <linearGradient id="ts-card-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Back-card gets a cooler, deeper tint -->
    <linearGradient id="ts-card-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Spark: white core fading through gold to transparent -->
    <radialGradient id="ts-spark">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fef3c7"/>
      <stop offset="0.7"  stop-color="#fcd34d" stop-opacity="0.4"/>
      <stop offset="1"    stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <filter id="ts-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <filter id="ts-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Backplate -->
  <rect width="200" height="200" rx="44" fill="url(#ts-bg)"/>
  <!-- Inner ring highlight -->
  <rect x="1.5" y="1.5" width="197" height="197" rx="42.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <!-- Aurora wash -->
  <rect width="200" height="200" rx="44" fill="url(#ts-aurora)"/>

  <!-- ── Two tilted "BOM" cards crossing each other ─────────────────────
       Reads as a comparison/diff at any size, and the intersection where
       they cross becomes the focal spark — that's the "AI moment". -->

  <!-- Back card (rotated -10°, cyan tint) -->
  <g transform="rotate(-10 100 100)" filter="url(#ts-shadow)">
    <rect x="48" y="46" width="104" height="120" rx="14" fill="url(#ts-card-back)"/>
    <!-- minimalist data dots, magenta accent -->
    <circle cx="68" cy="74"  r="4" fill="#0e7490"/>
    <circle cx="92" cy="74"  r="4" fill="#a21caf"/>
    <circle cx="116" cy="74" r="4" fill="#0e7490"/>
    <circle cx="68" cy="100" r="4" fill="#0e7490"/>
    <circle cx="92" cy="100" r="4" fill="#0e7490"/>
    <circle cx="116" cy="100" r="4" fill="#a21caf"/>
    <circle cx="68" cy="126" r="4" fill="#a21caf"/>
    <circle cx="92" cy="126" r="4" fill="#0e7490"/>
    <circle cx="116" cy="126" r="4" fill="#0e7490"/>
  </g>

  <!-- Front card (rotated +10°, glassy white) -->
  <g transform="rotate(10 100 100)" filter="url(#ts-shadow)">
    <rect x="48" y="34" width="104" height="120" rx="14" fill="url(#ts-card-front)"/>
    <!-- subtle column rule -->
    <line x1="84" y1="50" x2="84" y2="138" stroke="#c7d2fe" stroke-width="1.4"/>
    <line x1="116" y1="50" x2="116" y2="138" stroke="#c7d2fe" stroke-width="1.4"/>
    <!-- header band -->
    <rect x="58" y="50" width="84" height="6" rx="3" fill="#6366f1"/>
    <!-- data rows -->
    <rect x="58" y="68" width="22" height="5" rx="2" fill="#475569"/>
    <rect x="90" y="68" width="20" height="5" rx="2" fill="#94a3b8"/>
    <rect x="120" y="68" width="20" height="5" rx="2" fill="#94a3b8"/>
    <!-- emerald-highlighted matched row -->
    <rect x="56" y="80" width="88" height="14" rx="4" fill="#bbf7d0"/>
    <rect x="58" y="86" width="22" height="5" rx="2" fill="#15803d"/>
    <rect x="90" y="86" width="20" height="5" rx="2" fill="#15803d"/>
    <rect x="120" y="86" width="20" height="5" rx="2" fill="#15803d"/>
    <!-- struck-through removed row -->
    <rect x="58" y="102" width="22" height="5" rx="2" fill="#fca5a5"/>
    <rect x="90" y="102" width="20" height="5" rx="2" fill="#fca5a5"/>
    <rect x="120" y="102" width="20" height="5" rx="2" fill="#fca5a5"/>
    <line x1="56" y1="105" x2="142" y2="105" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round"/>
    <!-- one more plain row -->
    <rect x="58" y="118" width="22" height="5" rx="2" fill="#475569"/>
    <rect x="90" y="118" width="20" height="5" rx="2" fill="#94a3b8"/>
    <rect x="120" y="118" width="20" height="5" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Central AI burst/spark — sits at the cards' intersection -->
  <g transform="translate(100 100)">
    <!-- Soft halo -->
    <circle r="36" fill="url(#ts-spark)" filter="url(#ts-glow)"/>
    <!-- Rotated 8-point starburst -->
    <g fill="#ffffff" filter="url(#ts-glow)">
      <path d="M0 -22 L4 -4 L22 0 L4 4 L0 22 L-4 4 L-22 0 L-4 -4 Z"/>
      <g transform="rotate(45)">
        <path d="M0 -14 L2.5 -2.5 L14 0 L2.5 2.5 L0 14 L-2.5 2.5 L-14 0 L-2.5 -2.5 Z" opacity="0.9"/>
      </g>
    </g>
    <!-- Tiny satellite particles -->
    <circle cx="26" cy="-22" r="2.2" fill="#ffffff"/>
    <circle cx="-30" cy="18" r="1.6" fill="#ffffff" opacity="0.85"/>
    <circle cx="22" cy="26" r="1.4" fill="#fcd34d"/>
    <circle cx="-22" cy="-26" r="1.2" fill="#fcd34d" opacity="0.8"/>
  </g>

  <!-- Diff arrow — sits diagonally bottom-right, signals "compare/transform" -->
  <g transform="translate(150 152) rotate(-12)">
    <rect x="-26" y="-9" width="52" height="18" rx="9" fill="#ffffff" fill-opacity="0.96"/>
    <path d="M-16 0 L-7 -5 L-7 -1.5 L7 -1.5 L7 -5 L16 0 L7 5 L7 1.5 L-7 1.5 L-7 5 Z" fill="#4f46e5"/>
  </g>
</svg>
