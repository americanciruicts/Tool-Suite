services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bom_comparison_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bom_compare_user:postgres@aci-database:5432/bom_compare
    restart: unless-stopped
    networks:
      - app-network
      - db-consolidation_aci-network
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bom_comparison_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: bom_comparison_nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 
  db-consolidation_aci-network:
    external: true
